<div
  class="max-w-md mx-auto px-4 py-12"
>

  <div
    class="bg-white rounded-xl shadow-md p-6 md:p-8"
  >

    <h1
      class="text-2xl font-bold mb-6 text-center text-gray-800"
    >
      {{
        isRegistering
          ? 'Create Account'
          : 'Marketplace Login'
      }}
    </h1>

    <!-- Error -->
    <div
      *ngIf="errorMessage"
      class="mb-5 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm"
    >
      {{ errorMessage }}
    </div>

    <!-- LOGIN -->
    <div *ngIf="!isRegistering">

      <div class="mb-4">

        <label
          class="block text-gray-700 font-semibold mb-2"
        >
          Email Address
        </label>

        <input
          [(ngModel)]="credentials.email"
          type="email"
          placeholder="user@example.com"
          class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />

      </div>

      <div class="mb-6">

        <label
          class="block text-gray-700 font-semibold mb-2"
        >
          Password
        </label>

        <input
          [(ngModel)]="credentials.password"
          type="password"
          placeholder="Password"
          class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />

      </div>

      <button
        type="button"
        (click)="onLogin()"
        [disabled]="isLoading"
        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed transition"
      >
        {{
          isLoading
            ? 'Logging in...'
            : 'Login'
        }}
      </button>

      <p
        class="text-center text-sm text-gray-600 mt-4"
      >
        Don't have an account?

        <button
          type="button"
          (click)="switchToRegister()"
          class="text-indigo-600 font-semibold hover:underline"
        >
          Register
        </button>

      </p>

    </div>

    <!-- REGISTER -->
    <div *ngIf="isRegistering">

      <div class="mb-4">

        <label
          class="block text-gray-700 font-semibold mb-2"
        >
          Username
        </label>

        <input
          [(ngModel)]="registerData.username"
          type="text"
          placeholder="johndoe"
          class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />

      </div>

      <div class="mb-4">

        <label
          class="block text-gray-700 font-semibold mb-2"
        >
          Email Address
        </label>

        <input
          [(ngModel)]="registerData.email"
          type="email"
          placeholder="user@example.com"
          class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />

      </div>

      <div class="mb-4">

        <label
          class="block text-gray-700 font-semibold mb-2"
        >
          Password
        </label>

        <input
          [(ngModel)]="registerData.password"
          type="password"
          placeholder="Password"
          class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />

      </div>

      <div class="mb-6">

        <label
          class="block text-gray-700 font-semibold mb-2"
        >
          Location (City)
        </label>

        <input
          [(ngModel)]="registerData.location"
          type="text"
          placeholder="Mumbai"
          class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />

      </div>

      <button
        type="button"
        (click)="onRegister()"
        [disabled]="isLoading"
        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 disabled:opacity-60 disabled:cursor-not-allowed transition"
      >
        {{
          isLoading
            ? 'Creating Account...'
            : 'Register Account'
        }}
      </button>

      <p
        class="text-center text-sm text-gray-600 mt-4"
      >
        Already have an account?

        <button
          type="button"
          (click)="switchToLogin()"
          class="text-indigo-600 font-semibold hover:underline"
        >
          Login
        </button>

      </p>

    </div>

  </div>

</div>
